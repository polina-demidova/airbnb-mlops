services:
  train:
    build:
      context: .
      dockerfile: Dockerfile.train
    image: airbnb-train:latest
    env_file:
      - .env
    environment:
      MODEL_PATH: /models/model.pkl
    volumes:
      - ./models:/models

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: airbnb-api:latest
    environment:
      MODEL_PATH: /models/model.pkl
    volumes:
      - ./models:/models:ro
    ports:
      - "8000:8000"
    depends_on:
      train:
        condition: service_completed_successfully